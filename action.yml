name: Install and cache Homebrew packages
description: Cache Homebrew formulae and casks to speed up your workflows

inputs:
  packages:
    description: Formulae or casks to install
    required: true
  cache:
    description: Cache the downloaded packages
    default: true
  type:
    description: The type of packages to install (formula or cask)
    default: any

branding:
  icon: package
  color: yellow

runs:
  using: "composite"
  steps:
    - name: Prepare
      id: prep
      run: |
        packages="${{ inputs.packages }}"
        packages="${packages//$'\n'/ }"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

        flags=""
        if [ ${{ inputs.type }} != 'any' ]; then
          flags+="--${{ inputs.type }} "
        fi
        echo "flags=$flags" >> "$GITHUB_OUTPUT"

        if [ ${{ inputs.cache }} == 'true' ]; then
          mkdir .brew-install
          to_install=$(brew install $flags --dry-run --quiet -- $packages | awk '
            function flush(   i, line, words, n, j) {
              if (section == "" || nlines == 0) return
              for (i = 1; i <= nlines; i++) {
                line = lines[i]
                sub(/^[[:space:]]+/, "", line)
                n = split(line, words, /[[:space:]]+/)
                for (j = 1; j <= (nlines == expected ? 1 : n); j++) {
                  if (words[j] != "") print section, words[j]
                }
              }
              delete lines
              nlines = 0
            }
            /^==> Would (install|upgrade|reinstall) [0-9]+ formula(e|s)?:/ {
              flush(); section = "formula"; expected = $4; next
            }
            /^==> Would (install|upgrade|reinstall) [0-9]+ casks?:/ {
              flush(); section = "cask"; expected = $4; next
            }
            /^==> Would (install|upgrade|reinstall) [0-9]+ dependenc(y|ies)/ {
              flush(); section = "dependency"; expected = $4; next
            }
            /^==>/ { flush(); section = ""; next }
            /installed but outdated/ { next }
            section != "" && NF { lines[++nlines] = $0 }
            END { flush() }
          ')

          formulae="$(awk '$1 == "formula" { print $2 }' <<< "$to_install")"
          casks="$(awk '$1 == "cask" { print $2 }' <<< "$to_install")"
          dependencies="$(awk '$1 == "dependency" { print $2 }' <<< "$to_install")"

          {
            [ -z "$formulae" ] || brew --cache --formula -- $formulae
            [ -z "$casks" ] || brew --cache --cask -- $casks
            [ -z "$dependencies" ] || brew --cache -- $dependencies
          } | sort -u > .brew-install/cache-paths.txt
          printf '%s\n' "$to_install" | awk 'NF' | sort -u > .brew-install/packages.txt

          {
            echo 'cache-paths<<"EOF"'
            cat .brew-install/cache-paths.txt
            echo '"EOF"'
          } >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - name: Restore cache
      id: cache
      if: inputs.cache == 'true' && steps.prep.outputs.cache-paths != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.prep.outputs.cache-paths }}
        key: brew-install-${{ hashFiles('.brew-install/packages.txt') }}-${{ hashFiles('.brew-install/cache-paths.txt') }}
        restore-keys: brew-install-${{ hashFiles('.brew-install/packages.txt') }}-
    - name: Install packages
      if: inputs.cache != 'true' || steps.prep.outputs.cache-paths != ''
      run: brew install ${{ steps.prep.outputs.flags }} -- ${{ steps.prep.outputs.packages }}
      shell: bash
    - name: Save cache
      if: inputs.cache == 'true' && steps.prep.outputs.cache-paths != '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.prep.outputs.cache-paths }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Clean up
      if: inputs.cache == 'true' && always()
      run: |
        rm -rf .brew-install
      shell: bash
